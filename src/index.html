<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Devom · Desarrollo de software en Chile</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Devom diseña y programa sitios web, sistemas a medida y aplicaciones para empresas, instituciones y organizaciones de Chile."
    />
    <meta name="theme-color" content="#050B24" />
    <link rel="icon" type="image/png" href="devom-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      // Antes de pintar: activa las animaciones y aplica el tema guardado para evitar parpadeos.
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('devom-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
